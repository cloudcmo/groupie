  <script>
  /* Arrival from the old domain (groupie.fun): the hand-off page there puts a
     copy of its localStorage in the hash as guffmove=<base64url JSON>. Write in
     any key we don't already have, then drop guffmove from the hash, leaving
     #guff=<id> for the Guff bar. Runs before app.js. (domain move, Oct 2026) */
  (function(){
    try{
      var h=location.hash||"", m=h.match(/[#&]guffmove=([A-Za-z0-9_-]+)/); if(!m) return;
      var b=m[1].replace(/-/g,"+").replace(/_/g,"/"); while(b.length%4) b+="=";
      var bundle=JSON.parse(decodeURIComponent(escape(atob(b))));
      Object.keys(bundle).forEach(function(k){ if(localStorage.getItem(k)===null) localStorage.setItem(k,bundle[k]); });
      var cleaned=h.replace(/[#&]guffmove=[A-Za-z0-9_-]+/,"");
      if(cleaned&&cleaned.charAt(0)==="&") cleaned="#"+cleaned.slice(1);
      history.replaceState(null,"",location.pathname+location.search+(cleaned&&cleaned!=="#"?cleaned:""));
    }catch(e){}
  })();
  </script>

  <script>
  /* Eras (11 Nov 2026): a different gaming era each weekday, by the grid's
     date. Set here so the right skin and font arrive before first paint;
     app.js calls GroupieEra.apply(date) again once the grid is known (back
     grids keep their own day's era). ?era=sat previews any day.
     12 Nov 2026: players can opt out to the classic look (localStorage
     groupie_classic = "1"); the masthead link in app.js toggles it. */
  (function(){
    var E={0:["sun","shooter HUD","Black+Ops+One&family=Rajdhani:wght@600;700&family=Share+Tech+Mono"],
      1:["mon","bat and ball","Silkscreen:wght@400;700&family=Space+Mono:wght@400;700"],
      2:["tue","woodgrain console","Jersey+15&family=Jersey+25"],
      3:["wed","vector arcade",""],
      4:["thu","8-bit micro","Sixtyfour&family=IBM+Plex+Mono:wght@500;700"],
      5:["fri","16-bit","Pixelify+Sans:wght@500;700&family=Rubik:wght@600;700"],
      6:["sat","sports arcade","Tiny5&family=Doto:wght@900&family=Barlow+Semi+Condensed:wght@500;700"]};
    var BG={sun:"#11140f",mon:"#000000",tue:"#000000",wed:"#020308",thu:"#d7d7d7",fri:"#3a8cff",sat:"#2e7d32"};
    var loaded={}, cur=null, CK="groupie_classic";
    function classicPref(){ try{ return localStorage.getItem(CK)==="1"; }catch(err){ return false; } }
    function forced(){ return (location.search.match(/[?&]era=(mon|tue|wed|thu|fri|sat|sun)\b/)||[])[1]||null; }
    function natural(iso){
      var ok=iso&&/^\d{4}-\d\d-\d\d$/.test(iso)&&iso!=="0000-00-00";
      return E[ok ? new Date(iso+"T12:00:00Z").getUTCDay() : new Date().getDay()];
    }
    function apply(iso){
      var nat=natural(iso), f=forced(), e=nat, h=document.documentElement;
      if(f){ for(var k in E){ if(E[k][0]===f) e=E[k]; } }
      else if(classicPref()) e=E[3];
      h.setAttribute("data-era",e[0]);
      if(e[0]==="wed") h.removeAttribute("data-alt"); else h.setAttribute("data-alt","");
      if(e[2]&&!loaded[e[0]]){
        loaded[e[0]]=1;
        var l=document.createElement("link"); l.rel="stylesheet";
        l.href="https://fonts.googleapis.com/css2?family="+e[2]+"&display=swap";
        document.head.appendChild(l);
      }
      var m=document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute("content",BG[e[0]]);
      cur={key:e[0],name:e[1],natural:{key:nat[0],name:nat[1]},classic:!f&&classicPref(),forced:!!f}; return cur;
    }
    function setClassic(on){ try{ if(on) localStorage.setItem(CK,"1"); else localStorage.removeItem(CK); }catch(err){} }
    window.GroupieEra={apply:apply,get:function(){return cur;},setClassic:setClassic};
    try{ apply(null); }catch(err){}
  })();
  </script>
