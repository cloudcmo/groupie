name = "groupie"
main = "src/index.js"
compatibility_date = "2026-07-01"
# Keep the workers.dev URL enabled — no deploy (manual or GitHub) can turn it off.
workers_dev = true

# Static front end — served for every path the Worker doesn't claim.
[assets]
directory = "public"
binding = "ASSETS"
# Worker first, assets after: without this "/" is served straight from the
# asset store and the old-domain hand-off in src/moved.js never runs.
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "groupie"
database_id = "6cd5c1cc-beef-49a1-a163-c57e5ede2774"

[vars]
# Puzzle #1 is this date. Set to your launch date before first deploy.
EPOCH_DATE = "2026-08-01"
# The daily cron tops the queue back up to this many days ahead.
# 14, not 45: a fortnight is ample safety runway, and twice in one week
# a rule change condemned the whole banked queue — a smaller buffer caps
# both the standing spend and the cost of throwing banked days away.
TOPUP_TARGET_DAYS = "14"
# The Friday games newsletter segment in Resend (shared with Whenly / Pub Quiz Daily / What Word).
RESEND_SEGMENT_ID = "90610922-0511-40a1-a3d1-2c645d992210"

# If the queue ever falls below LOW_WATER days after a top-up, an alert
# email goes here (sent via Resend, so RESEND_API_KEY must be set).
# Carl's WORKING inbox — the Sept 2026 outage went unnoticed for a week
# because alerts were going to cloudcmo.co.uk, which he doesn't watch.
ALERT_EMAIL = "carl@mesnerlyons.com"

[triggers]
# Morning run (06:25 UTC) tops the queue up to TOPUP_TARGET_DAYS.
# The 18:25 self-healing second run was dropped on 8 Oct 2026 to free one
# of the account's five free cron slots for the client-files-worker survey
# reminders: with a 45-day queue and the low-water alert below, one bad
# morning is recovered the next day with nothing lost.
# (Offset from What Word's 06:15 so the crons never contend.)
crons = ["25 6 * * *"]
